---
- name: Provision GZ::CTF
  hosts: gzctf
  become: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - openssl
          - unzip
        state: present
        update_cache: true

    - name: Install Docker
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Read Docker socket group id
      ansible.builtin.command: stat -c '%g' /var/run/docker.sock
      register: docker_gid
      changed_when: false

    - name: Create deployment directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "0755"
      loop:
        - { path: /opt/gzctf, owner: root, group: root }
        - { path: /opt/gzctf/files, owner: "1654", group: "1654" }

    - name: Install compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../compose.yaml"
        dest: /opt/gzctf/compose.yaml
        mode: "0644"

    - name: Install Caddyfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../Caddyfile"
        dest: /opt/gzctf/Caddyfile
        mode: "0644"

    - name: Render environment file
      ansible.builtin.template:
        src: env.j2
        dest: /opt/gzctf/.env
        mode: "0600"
      no_log: true

    - name: Pull application image
      ansible.builtin.command: docker compose pull gzctf
      args:
        chdir: /opt/gzctf
      when: gzctf_image is match('^(ghcr\.io|docker\.io|quay\.io)/')
      changed_when: false

    - name: Pull support images
      ansible.builtin.command: docker compose pull postgres redis caddy
      args:
        chdir: /opt/gzctf
      changed_when: false

    - name: Start stack
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: /opt/gzctf
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Recreated' in compose_up.stdout"

    - name: Wait for the platform API
      ansible.builtin.uri:
        url: "https://{{ gzctf_domain }}/api/info"
        status_code: 200
        validate_certs: true
      register: api_check
      retries: 24
      delay: 5
      until: api_check.status == 200

    - name: Show container state
      ansible.builtin.command: docker compose ps
      args:
        chdir: /opt/gzctf
      register: compose_ps
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
